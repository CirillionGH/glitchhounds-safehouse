<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Room Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111118;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
    }
  </style>
  <!-- Lottie Web Player (Added for Discord Animated Vector Stickers) -->

  <script src="game.js"></script>

<body>
  <div id="game-container"></div>
</body>
</html>
